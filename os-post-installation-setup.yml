---
- name: Post-installation setup
  hosts: all
  tasks:
    - name: Install additional software.
      ansible.builtin.shell: |
        apt-get update --allow-insecure-repositories
        DEBIAN_FRONTEND=noninteractive apt-get install --yes --allow-unauthenticated \
          '?priority(standard)' task-gnome-desktop task-laptop curl git \
          linux-headers-amd64 broadcom-sta-dkms sshpass ansible-core
    - name: Set the root password to 'password'.
      ansible.builtin.shell: |
        echo "root:password" | chpasswd
    - name: >
        Create the initial user account 'andrew', set the password to 'password', and
        add the initial user to the `sudo` group.
      ansible.builtin.shell: |
        adduser --disabled-password --comment "Andrew" andrew
        echo "andrew:password" | chpasswd
        usermod --append --groups sudo andrew
    - name: Remove the "Linux Boot Manager" boot entry.
      ansible.builtin.shell: |
        efibootmgr --delete-bootnum \
          --bootnum $(efibootmgr | grep "Linux Boot Manager" | cut --characters=5-8)
    - name: >
        Deactivate the temporary software repository configuration used to install the
        target OS.
      ansible.builtin.shell: |
        rm /etc/apt/sources.list
    - name: Set up software repositories for the APT package manager.
      ansible.builtin.shell: |
        cp /usr/share/doc/apt/examples/debian.sources \
          /etc/apt/sources.list.d/debian.sources
    - name: Purge the previously installed OpenSSH server package and configuration.
      ansible.builtin.shell: |
        DEBIAN_FRONTEND=noninteractive apt-get purge --autoremove --yes openssh-server
    - name: Download and extract the Nix installer.
      ansible.builtin.shell: |
        curl http://192.168.1.1:8000/nix-2.35.1-x86_64-linux.tar.xz \
          | tar --extract --xz --directory /tmp
    - name: Install Nix.
      ansible.builtin.shell: |
        /tmp/nix-2.35.1-x86_64-linux/install --daemon --yes
    - name: Clean up Nix installer files.
      ansible.builtin.shell: |
        rm --recursive --force /tmp/nix-2.35.1-x86_64-linux
    - name: Power off the target computer.
      ansible.builtin.shell: |
        poweroff
      ignore_unreachable: true
